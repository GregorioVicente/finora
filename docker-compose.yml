services:
  backend:
    build: ./backend
    environment:
      JWT_SECRET: ${JWT_SECRET:-finora-local-secret-key-change-in-production-2026-secure}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10
  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
