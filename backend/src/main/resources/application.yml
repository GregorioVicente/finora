spring:
  datasource:
    url: jdbc:h2:file:./data/finora;AUTO_SERVER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  h2:
    console:
      enabled: true
server:
  error:
    include-message: always
finora:
  jwt-secret: ${JWT_SECRET:finora-local-secret-key-change-in-production-2026-secure}
  jwt-expiration-ms: 86400000
